    <style>
      :root {
        --font-sans: 'Inter', sans-serif;
        --font-serif: 'Lora', serif;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background-color: #000;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      .theme-serif { font-family: var(--font-serif); }
      .theme-sans { font-family: var(--font-sans); }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .select-none {
        user-select: none;
        -webkit-user-select: none;
        pointer-events: auto;
      }
      
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      @keyframes search-panel-in {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-search-panel-in { animation: search-panel-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
